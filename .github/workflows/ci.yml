name: CI - Biblioteca Pessoal

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Permitir Maven Wrapper
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Permitir Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes
        run: ./mvnw clean test

      - name: Upload relatórios Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  coverage:
    runs-on: ubuntu-latest
    needs: test

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Permitir Maven Wrapper
        run: chmod +x mvnw

      - name: Gerar cobertura JaCoCo
        run: ./mvnw clean verify

      - name: Upload relatório JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  sonarqube:
    runs-on: ubuntu-latest
    needs: coverage
    if: github.ref == 'refs/heads/main'

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Permitir Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar verify
        run: ./mvnw clean verify

      - name: SonarCloud
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=Lopezez-git_Biblioteca--Qualidade-de-Software \
            -Dsonar.organization=lopezez-git \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}