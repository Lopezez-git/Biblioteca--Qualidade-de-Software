<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <h1 th:text="${titulo_pagina}">Livro</h1>
        <a th:href="@{/livros}" class="btn-secondary">← Voltar</a>
    </div>

    <div class="form-container">
        <form th:action="@{/livros/salvar}" method="post" th:object="${livro}">
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{criadoEm}"/>

            <div class="form-row">
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="titulo" th:field="*{titulo}" required placeholder="Ex: Dom Quixote"/>
                </div>
                <div class="form-group">
                    <label>Autor *</label>
                    <input type="text" id="autor" th:field="*{autor}" required placeholder="Ex: Cervantes"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ano de Publicação *</label>
                    <input type="number" id="anoPublicacao" th:field="*{anoPublicacao}" required min="1000" max="2026"/>
                </div>
                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text" id="isbn" th:field="*{isbn}" placeholder="Ex: 9780142437230"/>
                    <button type="button" class="btn-isbn" onclick="buscarIsbn()">
                        <img th:src="@{/images/Ícone de lupa.png}" alt="buscar"/> Buscar na Open Library
                    </button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Gênero</label>
                    <input type="text" id="genero" th:field="*{genero}" placeholder="Ex: Romance"/>
                </div>
                <div class="form-group">
                    <label>Editora</label>
                    <input type="text" id="editora" th:field="*{editora}" placeholder="Ex: Companhia das Letras"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Status de Leitura</label>
                    <select id="status" th:field="*{status}">
                        <option th:each="s : ${statusOptions}" th:value="${s.name()}" th:text="${s.name()}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Avaliação (1-5 <img th:src="@{/images/Logo da estrela.png}" alt="estrela"/>)
                    </label>
                    <input type="number" id="avaliacaoNota" th:field="*{avaliacaoNota}" min="1" max="5"/>
                </div>
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <textarea id="descricao" th:field="*{descricao}" rows="3" placeholder="Sinopse..."></textarea>
            </div>

            <div class="form-group">
                <label>Notas Pessoais</label>
                <textarea id="notas" th:field="*{notas}" rows="3" placeholder="Suas anotações..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <img th:src="@{/images/salvar.png}" alt="salvar"/> Salvar
                </button>
                <a th:href="@{/livros}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
