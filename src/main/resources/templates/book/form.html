<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <h1 th:text="${titulo_pagina}">Livro</h1>
        <a th:href="@{/livros}" class="btn-secondary">← Voltar</a>
    </div>

    <div class="form-container">
        <form th:action="@{/livros/salvar}" method="post" th:object="${livro}">
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{criadoEm}"/>

            <div class="form-row">
                <div class="form-group">
                    <label for="titulo">Título *</label>
                    <input type="text" id="titulo" th:field="*{titulo}" required placeholder="Ex: Dom Quixote"/>
                </div>
                <div class="form-group">
                    <label for="autor">Autor *</label>
                    <input type="text" id="autor" th:field="*{autor}" required placeholder="Ex: Miguel de Cervantes"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="anoPublicacao">Ano de Publicação *</label>
                    <input type="number" id="anoPublicacao" th:field="*{anoPublicacao}" required
                           min="1000" max="2026" placeholder="Ex: 1605"/>
                </div>
                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" th:field="*{isbn}" placeholder="Ex: 9780142437230"
                           id="isbn-input"/>
                    <button type="button" class="btn-link" onclick="buscarIsbn()">🔍 Buscar na Open Library</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="genero">Gênero</label>
                    <input type="text" id="genero" th:field="*{genero}" placeholder="Ex: Romance, Ficção Científica"/>
                </div>
                <div class="form-group">
                    <label for="editora">Editora</label>
                    <input type="text" id="editora" th:field="*{editora}" placeholder="Ex: Companhia das Letras"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="status">Status de Leitura</label>
                    <select id="status" th:field="*{status}">
                        <option th:each="s : ${statusOptions}"
                                th:value="${s.name()}"
                                th:text="${s.name()}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="avaliacaoNota">Avaliação (1-5)</label>
                    <input type="number" id="avaliacaoNota" th:field="*{avaliacaoNota}"
                           min="1" max="5" placeholder="1 a 5 estrelas"/>
                </div>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" th:field="*{descricao}" rows="3"
                          placeholder="Sinopse ou comentário sobre o livro..."></textarea>
            </div>

            <div class="form-group">
                <label for="notas">Notas Pessoais</label>
                <textarea id="notas" th:field="*{notas}" rows="3"
                          placeholder="Suas anotações sobre o livro..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">💾 Salvar</button>
                <a th:href="@{/livros}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
