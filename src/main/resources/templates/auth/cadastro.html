<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro - Minha Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-card">
        <h1>📚 Minha Biblioteca</h1>
        <h2>Criar conta</h2>

        <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

        <form th:action="@{/auth/cadastro}" method="post">
            <div class="form-group">
                <label for="nomeCompleto">Nome Completo</label>
                <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Seu nome completo"/>
            </div>
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required
                       placeholder="Mínimo 3 caracteres" minlength="3"/>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com"/>
            </div>
            <div class="form-group">
                <label for="password">Senha *</label>
                <input type="password" id="password" name="password" required
                       placeholder="Mínimo 6 caracteres" minlength="6"/>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Confirmar Senha *</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" required
                       placeholder="Repita a senha"/>
            </div>
            <button type="submit" class="btn-primary btn-full">Criar Conta</button>
        </form>

        <p class="auth-link">Já tem conta? <a th:href="@{/auth/login}">Entrar</a></p>
    </div>
</div>
</body>
</html>
