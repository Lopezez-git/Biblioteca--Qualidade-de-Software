<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro - StarBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="background-stars"></div>
<div class="auth-wrapper">
    <div class="auth-box">
        <h2>Crie sua conta</h2>
        <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>
        <form th:action="@{/auth/cadastro}" method="post">
            <div class="form-group">
                <input type="text" name="nomeCompleto" placeholder="Nome completo"/>
            </div>
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required minlength="3"/>
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required/>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Senha (mín. 6 caracteres)" required minlength="6"/>
            </div>
            <div class="form-group">
                <input type="password" name="confirmarSenha" placeholder="Confirmar senha" required/>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="termos" required/>
                <label for="termos">Aceito os <a href="#" style="color:#F2F1D1">Termos de Uso</a> do StarBook.</label>
            </div>
            <button type="submit">Criar conta</button>
        </form>
        <p class="auth-link">Já tem conta? <a th:href="@{/auth/login}">Entrar</a></p>
    </div>
</div>
</body>
</html>
