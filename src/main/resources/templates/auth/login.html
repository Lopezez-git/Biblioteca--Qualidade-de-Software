<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - StarBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="background-stars"></div>
<div class="auth-wrapper">
    <div class="auth-box">
        <h2>
            <img th:src="@{/images/Logo da estrela.png}" alt="estrela"/> StarBook
        </h2>
        <div th:if="${param.error}" class="alert alert-error">Usuário ou senha inválidos.</div>
        <div th:if="${param.logout}" class="alert alert-success">Você saiu com sucesso.</div>
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required autofocus/>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Senha" required/>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="termos" required/>
                <label for="termos">Aceito os <a href="#" style="color:#F2F1D1">Termos de Uso</a> do StarBook.</label>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p class="auth-link">Não tem conta? <a th:href="@{/auth/cadastro}">Cadastre-se</a></p>
    </div>
</div>
</body>
</html>
