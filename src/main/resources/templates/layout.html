<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo ?: 'StarBook'}">StarBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="background-stars"></div>

<header class="header" sec:authorize="isAuthenticated()">
    <div class="header-container">
        <a th:href="@{/livros}" class="logo">
            <img th:src="@{/images/Logo da estrela.png}" alt="estrela" class="logo-icon"/> Star<span>Book</span>
        </a>
        <div class="search-bar">
            <form th:action="@{/livros}" method="get">
                <input type="text" name="busca" placeholder="Buscar por título..."/>
                <button type="submit">
                    <img th:src="@{/images/Ícone de lupa.png}" alt="buscar"/>
                </button>
            </form>
        </div>
        <div class="header-icons">
            <span class="header-user">Olá, <strong sec:authentication="name"></strong></span>
            <a th:href="@{/livros/novo}" class="btn-header-primary">+ Novo Livro</a>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <button type="submit" class="btn-header-logout">Sair</button>
            </form>
        </div>
    </div>
</header>

<div class="main-container">
    <div class="livros-page">
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>
        <th:block th:replace="${content}"></th:block>
    </div>
</div>

<footer>
    <p>
        <img th:src="@{/images/Logo da estrela.png}" alt="estrela"/> StarBook — Sua biblioteca pessoal
    </p>
</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
